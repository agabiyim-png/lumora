name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Web oyun dosyalarını doğrula
        run: |
          for f in app/src/main/assets/www/js/*.js; do node --check "$f"; done

      - name: APK derle
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK adını düzenle
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/Lumora-v1.0-build${{ github.run_number }}.apk
          ls -la out

      - name: Artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: Lumora-APK
          path: out/*.apk

      - name: Sürüm (Release) oluştur
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Lumora build ${{ github.run_number }}
          body: |
            Lumora — Android APK (otomatik derleme #${{ github.run_number }})
            Telefona indirip kurun. "Bilinmeyen kaynaklar" izni gerekebilir.
          files: out/*.apk
          make_latest: true
